<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel orb preview</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e2e0da;--accent:#8a1c2b}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--panel:#1f1f25;--ink:#ecebe7;--muted:#a09f99;--line:#33333b;--accent:#d0566a}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 12px;color:var(--muted);font-size:13px}
.panel{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:6px 0}
.member{text-align:center;width:150px;transition:opacity .35s}
.member canvas.big{width:132px;height:132px;display:block;margin:0 auto 4px;opacity:.82;transition:transform .35s ease,opacity .35s,filter .35s}
.member.speaking canvas.big{transform:scale(1.08);opacity:1}
.panel:has(.member.speaking) .member:not(.speaking) canvas.big{opacity:1;filter:brightness(.62) saturate(.75)}
.panel:has(.member.speaking) .member:not(.speaking) .nm,.panel:has(.member.speaking) .member:not(.speaking) .tt{opacity:.55}
.member.speaking .nm{color:var(--c)}
.nm{font-weight:650;font-size:14px}.tt{font-size:11px;color:var(--muted);line-height:1.2}
.kdm{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.big1{display:flex;justify-content:center}.big1 canvas{width:300px;height:300px}
</style></head><body><main>
<div class="card"><h1>Panel orbs</h1><p>The same orb the rehearsal screen now uses. Press a state to see it. "Auto" takes turns like a real panel.</p>
<div class="panel" id="members"></div>
<div class="bar" style="margin-top:12px" id="bar">
 <button data-s="idle" class="on">All idle</button><button data-s="thinking">Panel thinking</button>
 <button data-s="speak0">Graham speaks</button><button data-s="speak2">Daniel speaks</button><button data-s="auto">Auto</button></div></div>
<div class="card"><h1>Close-up</h1><p>Same orb, large, speaking, so you can judge the detail.</p>
<div class="big1"><div class="member speaking" id="solo" style="--c:#3b7dd8;width:auto"><canvas class="big" data-orb="#3b7dd8" style="width:300px;height:300px"></canvas></div></div></div>
</main>
<!--ORB_JS-->
<script>
const P=[['Graham','Finance Director','#d4a017',1],['Tracey','Field Operations Manager','#2e8b57',0],['Daniel','Client Contact','#c0392b',1],['Priya','Insights & Reporting Lead','#3b7dd8',0],['Liam','Channel Expert','#8e44ad',0]];
document.getElementById('members').innerHTML=P.map((p,i)=>`<div class="member" id="m${i}" style="--c:${p[2]}"><canvas class="big" data-orb="${p[2]}"></canvas><div class="nm">${p[0]}</div><div class="tt">${p[1]}</div>${p[3]?'<div class="kdm">DECISION-MAKER</div>':''}</div>`).join('');
PitchOrb.attachAll(document);
const M=[...document.querySelectorAll('#members .member')];let timer=null;
function clear(){M.forEach(m=>m.classList.remove('speaking','thinking'));clearInterval(timer)}
function set(s){clear();document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
 if(s==='thinking')M.forEach(m=>m.classList.add('thinking'));
 else if(s.startsWith('speak'))M[+s.slice(5)].classList.add('speaking');
 else if(s==='auto'){let i=0;const go=()=>{M.forEach(m=>m.classList.remove('speaking','thinking'));const m=M[i++%M.length];m.classList.add('thinking');setTimeout(()=>{m.classList.remove('thinking');m.classList.add('speaking')},1400)};go();timer=setInterval(go,5200)}}
document.getElementById('bar').onclick=e=>{const b=e.target.closest('button');if(b)set(b.dataset.s)};
window.__set=set;
</script></body></html>
